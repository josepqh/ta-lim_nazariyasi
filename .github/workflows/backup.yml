name: Database backup

# Every night at 02:30 Tashkent time, and on demand from the Actions tab.
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The dump holds names, emails and password hashes, so it is encrypted before it
      # leaves the runner; anyone who can download the artifact still needs the passphrase.
      - name: Dump and encrypt the database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets (see README)."
            exit 1
          fi
          umask 077
          docker run --rm -e DATABASE_URL="$BACKUP_DATABASE_URL" \
            postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' > database.dump
          test -s database.dump
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output database.dump.gpg database.dump
          shred -u database.dump
          echo "Backup size: $(du -h database.dump.gpg | cut -f1)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-${{ github.run_id }}
          path: database.dump.gpg
          retention-days: 30
          if-no-files-found: error
